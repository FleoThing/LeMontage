[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lemontage"
version = "0.7.0"
description = "A pipeline-first framework for content creators: clips, reels, TikToks, shorts and podcasts."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "florian FILLOUX" }]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
# Everything the execution engine needs to actually produce media. Kept optional
# so `lemontage validate` stays dependency-light; `lemontage run` requires these.
engine = [
    "imageio-ffmpeg>=0.4",
    "faster-whisper>=1.0",
]
# Per-shot visual quality scoring for `lemontage analyze --visual` (motion via
# optical flow, sharpness via Laplacian variance). Opt-in: heavier than the
# FFmpeg+Whisper core, and only useful when an agent wants to rank shots.
analyze = [
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
]
# Beat detection for `detect_clips: method: beat` (music-synced cuts). Opt-in:
# librosa pulls scipy/scikit-learn/numba, only needed when scoring to a track.
beat = [
    "librosa>=0.10",
    "numpy>=1.24",
]
# Subject-following vertical crop for `export: smart_crop: true`, and the focal
# point the `still` zooms aim at. OpenCV decodes the sampled frames and runs the
# face detector itself (`cv2.FaceDetectorYN`, 4.5.4+), so this is one dependency,
# not two. Opt-in.
smartcrop = [
    "opencv-python-headless>=4.8",
]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
lemontage = "lemontage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The vendored YuNet weights `focal_point` falls back to — without this the wheel
# ships the code and not the 227 KB it needs.
[tool.setuptools.package-data]
"lemontage.engine" = ["models/*.onnx"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Typer requires its Option/Argument calls in parameter defaults (the framework
# idiom); B008 flags exactly that pattern, so silence it for the CLI module.
"src/lemontage/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
